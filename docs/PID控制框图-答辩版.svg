<text x="86" y="749" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="12.8" fill="#0b1420" font-weight="normal" font-style="normal">Kp = 0.155    Ki = 0.01    Kd = 0.01</text>
