<rect x="1090" y="691" width="5" height="20" rx="2.5" fill="#c0582f"/>
<text x="1106" y="708" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="17" fill="#0b1420" font-weight="700" font-style="normal">实现要点</text>
<text x="1092" y="749" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="12.8" fill="#0b1420" font-weight="normal" font-style="normal">积分分离：|e| &lt; 30 时才累加，抑制积分饱和</text>
