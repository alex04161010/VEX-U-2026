<text x="1092" y="813" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="12.8" fill="#0b1420" font-weight="normal" font-style="normal">到位判据：进入容差并稳定 100 ms / 200 ms</text>
<text x="60" y="878" text-anchor="start" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="11.8" fill="#6f675a" font-weight="normal" font-style="italic">注：限幅为速度指令上限，容差与设定值同量纲；两个控制环共用同一个 PID 计算函数。</text>
